<section class="create-page section-container">
  <div class="create-heading"><span class="eyebrow"><i></i> Sua vez de compartilhar</span><h1>Coloque uma receita<br /><em>na mesa.</em></h1><p>Preencha os campos abaixo e ajude a deixar o ReceitaHub ainda mais saboroso.</p></div>
  <form #formulario="ngForm" (ngSubmit)="salvar(formulario)" novalidate class="recipe-form">
    <div class="form-section"><span class="section-number">01</span><div class="form-fields"><h2>Sobre a receita</h2><div class="field-grid"><label class="field full"><span>Nome da receita *</span><input name="nome" [(ngModel)]="receita.nome" required #nome="ngModel" placeholder="Ex.: Lasanha de berinjela" />@if (nome.invalid && (nome.touched || formulario.submitted)) { <small>Informe o nome da receita.</small> }</label><label class="field full"><span>Descrição *</span><textarea name="descricao" [(ngModel)]="receita.descricao" required rows="3" #descricao="ngModel" placeholder="Conte em poucas palavras o que torna esta receita especial."></textarea>@if (descricao.invalid && (descricao.touched || formulario.submitted)) { <small>Escreva uma breve descrição.</small> }</label></div></div></div>
    <div class="form-section"><span class="section-number">02</span><div class="form-fields"><h2>O preparo</h2><div class="field-grid"><label class="field"><span>Categoria *</span><select name="categoria" [(ngModel)]="receita.categoria" required>@for (categoria of categorias; track categoria) { <option [value]="categoria">{{ categoria }}</option> }</select></label><label class="field"><span>Tempo (minutos) *</span><input type="number" name="tempoPreparo" [(ngModel)]="receita.tempoPreparo" min="1" required #tempo="ngModel" />@if (tempo.invalid && (tempo.touched || formulario.submitted)) { <small>Use um tempo maior que zero.</small> }</label><label class="field"><span>Dificuldade *</span><select name="dificuldade" [(ngModel)]="receita.dificuldade" required><option value="Fácil">Fácil</option><option value="Média">Média</option><option value="Difícil">Difícil</option></select></label><label class="field full"><span>Ingredientes * <small>(um por linha)</small></span><textarea name="ingredientes" [(ngModel)]="ingredientesTexto" required rows="5" placeholder="1 xícara de farinha&#10;2 ovos&#10;..." #ingredientes="ngModel"></textarea>@if (ingredientes.invalid && (ingredientes.touched || formulario.submitted)) { <small>Adicione ao menos um ingrediente.</small> }</label><label class="field full"><span>Modo de preparo * <small>(um passo por linha)</small></span><textarea name="preparo" [(ngModel)]="preparoTexto" required rows="5" placeholder="Misture os ingredientes secos&#10;Leve ao forno..." #preparo="ngModel"></textarea>@if (preparo.invalid && (preparo.touched || formulario.submitted)) { <small>Adicione os passos do preparo.</small> }</label></div></div></div>
    <div class="form-section"><span class="section-number">03</span><div class="form-fields"><h2>Uma imagem vale...</h2><div class="field-grid"><label class="field full"><span>URL da imagem *</span><input type="url" name="imagem" [(ngModel)]="receita.imagem" required #imagem="ngModel" placeholder="https://..." />@if (imagem.invalid && (imagem.touched || formulario.submitted)) { <small>Informe uma URL de imagem.</small> }</label></div></div></div>
    <div class="form-actions"><a routerLink="/receitas" class="text-link">Cancelar</a><button class="primary-button" type="submit" [disabled]="sucesso">{{ sucesso ? 'Receita salva! ✓' : 'Publicar receita ↗' }}</button></div>
  </form>
</section>
